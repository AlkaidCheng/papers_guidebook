# The jet-tagging architectures page, book/ml-hep/jet-tagging.md, and its BibTeX
# file. `python scripts/catalogue.py build` writes both from this file and
# papers.yaml. An entry's year defaults to that of its first paper; code links
# are those the papers themselves give.

page:
  path: ml-hep/jet-tagging.md
  title: Jet-Tagging Architectures
  label: Architectures
  summary: Neural-network architectures for jet tagging, from jet images to Lorentz-equivariant transformers, with their papers and code.

intro: >-
  Neural-network architectures for jet tagging, grouped by how they represent
  a jet. Entries were last checked against their papers in November 2026.

table:
  name: Architecture
  columns:
    - {key: idea, title: Idea}
    - {key: input, title: Input}

sections:
  - title: Images and trees
    entries:
      - id: jet-images
        name: Jet-image CNN
        idea: Convolutional network on a calorimeter image
        input: Jet image
        papers: [deOliveira:2015xxd]
        summary: Treats the jet as an image of its calorimeter deposits and classifies it with a convolutional network, here for boosted $W$ bosons.

      - id: colour-jet-images
        name: Jet images in colour
        idea: Separate channels for charged and neutral particles
        input: Multi-channel image
        papers: [Komiske:2016rsd]
        summary: Adds channels for charged and neutral transverse momentum and for charged-particle counts, for quark–gluon discrimination.

      - id: recnn
        name: Recursive network (RecNN)
        idea: Network follows the clustering tree
        input: Clustering history
        papers: [Louppe:2017ipp]
        links: {Code: "https://github.com/glouppe/recnn"}
        summary: Builds the jet embedding recursively along its sequential-recombination clustering history, as a language model parses a sentence.

  - title: Sets and graphs
    entries:
      - id: efn-pfn
        name: Energy and Particle Flow Networks
        idea: Per-particle map, sum, then map (Deep Sets)
        input: Particle set
        papers: [Komiske:2018cqr]
        summary: Permutation-invariant networks built on Deep Sets; the Energy Flow Network is infrared and collinear safe by construction.
        details: |
          - **Data:** released with the [quark and gluon jets](datasets.md#quark-gluon).

      - id: particlenet
        name: ParticleNet
        idea: Dynamic graph convolution
        input: Particle cloud
        papers: [Qu:2019gqs]
        summary: Treats the jet as an unordered particle cloud and classifies it with a dynamic graph convolutional network.

      - id: jedi-net
        name: JEDI-net
        idea: Interaction network over particle pairs
        input: Particle set
        papers: [Moreno:2019bmu]
        summary: Describes the jet as one-to-one interactions between its constituents and classifies it from the representation learned from them.
        details: |
          - **Data:** the [hls4ml jets](datasets.md#hls4ml-jets).

      - id: abcnet
        name: ABCNet
        idea: Graph network with attention
        input: Particle cloud
        papers: [Mikuni:2020wpr]
        summary: A graph network with attention for point-cloud collider data, applied to quark–gluon discrimination and to pile-up removal per particle.

  - title: Transformers
    entries:
      - id: point-cloud-transformer
        name: Point Cloud Transformer
        idea: Transformer adapted to unordered particles
        input: Particle cloud
        papers: [Mikuni:2021pou]
        summary: Applies a transformer designed for point clouds to the particles of boosted jets.

      - id: particle-transformer
        name: Particle Transformer (ParT)
        idea: Attention with pairwise particle features
        input: Particle set
        papers: [Qu:2022mxj]
        links: {Code: "https://github.com/jet-universe/particle_transformer"}
        summary: A transformer whose attention includes pairwise interaction features between particles.
        details: |
          - **Data:** released with [JetClass](datasets.md#jetclass); pre-trained models improve other tagging tasks after fine-tuning.

  - title: Lorentz-symmetric networks
    entries:
      - id: lola
        name: Lorentz Layer (LoLa)
        idea: Lorentz vectors and the Minkowski metric
        input: Four-vectors
        papers: [Butter:2017cot]
        summary: A top tagger whose layers work with particle four-vectors and the Minkowski metric, with calorimeter and tracking information.

      - id: lorentz-group-network
        name: Lorentz Group Network
        idea: Layers built from Lorentz-group representations
        input: Four-vectors
        papers: [Bogatskiy:2020tje]
        links: {Code: "https://github.com/fizisist/LorentzGroupNetwork"}
        summary: A network fully equivariant under the Lorentz group, with few parameters and competitive top tagging.

      - id: lorentznet
        name: LorentzNet
        idea: Message passing with Minkowski dot-product attention
        input: Four-vectors
        papers: [Gong:2022lye]
        links: {Code: "https://github.com/sdogsq/LorentzNet-release"}
        summary: A Lorentz-equivariant graph network that avoids high-order tensors by attending through Minkowski dot products.

      - id: pelican
        name: PELICAN
        idea: Permutation-equivariant layers on Lorentz invariants
        input: Four-vectors
        papers: [Bogatskiy:2022czk]
        related: [Bogatskiy:2023nnw]
        links: {Code: "https://github.com/abogatskiy/PELICAN"}
        summary: Takes inputs maximally reduced with respect to Lorentz symmetry and is permutation-equivariant throughout; a covariant variant regresses four-momenta.

      - id: l-gatr
        name: L-GATr
        idea: Lorentz-equivariant transformer in spacetime geometric algebra
        input: Four-vectors
        papers: [Spinner:2024hjm]
        links: {Code: "https://github.com/heidelberg-hepml/lorentz-gatr"}
        summary: A transformer whose features live in the geometric algebra of spacetime and transform equivariantly under the Lorentz group, used for regression, classification and generation.

see_also: |
  - Benchmarks for these architectures: the [jet-tagging datasets](datasets.md#jet-tagging),
    and the [comparison of top taggers](papers.md#kasieczka-2019dbj).
  - Pre-trained models for jet tagging: [Foundation Models](foundation-models.md).
