# The papers page, book/ml-hep/papers.md, and its BibTeX file.
# `python scripts/catalogue.py build` writes both from this file and the cache.
#
# A paper is keyed by its INSPIRE texkey and names its INSPIRE record
# (`inspire`); `python scripts/catalogue.py fetch` then stores its title, authors,
# journal, identifiers, BibTeX and reference list in catalogue/cache.json. This
# file holds only what a person writes: `category`, `tags`, a one-line `short`
# description and an optional `long` one. `venue` replaces the journal reference
# where INSPIRE has none, as for conference proceedings. A paper without an
# INSPIRE record gives `title`, `authors`, `year`, `url` and `bibtex` itself.
#
# Descriptions follow the papers' abstracts, checked in November 2026.

page:
  path: ml-hep/papers.md
  title: Papers
  summary: The papers behind the datasets, methods and tools of machine learning in particle physics, with their metadata, BibTeX and citations within this guide.

intro: >-
  Papers on machine learning in particle physics, by kind of contribution.
  Citations between papers of this guide come from INSPIRE-HEP reference lists.

categories:
  - id: dataset
    title: Datasets
  - id: challenge
    title: Challenges and comparisons
  - id: method
    title: Methods
  - id: application
    title: Applications in experiments
  - id: software
    title: Software
  - id: review
    title: Reviews

tags:
  - anomaly detection
  - equivariance
  - event classification
  - fast simulation
  - foundation models
  - generative models
  - inference
  - jet tagging
  - neutrino physics
  - open data
  - real-time inference
  - reconstruction
  - unfolding

papers:
  # ---- Datasets ---------------------------------------------------------------
  Komiske:2019jim:
    inspire: 1750786
    category: dataset
    tags: [open data, jet tagging]
    short: Jets from CMS 2011 open data, and the metric space of jets measured with the energy mover's distance.
    long: >-
      Isolates 1,690,984 central jets with transverse momentum above 375 GeV
      from 2.3 fb⁻¹ of 7 TeV CMS open data and compares them with simulation.
      The energy mover's distance between jets is used to study the space of
      jets and the effect of the detector.
  Amram:2024fjg:
    inspire: 2859866
    category: dataset
    tags: [open data, foundation models]
    short: Aspen Open Jets, about 178 M jets from CMS 2016 open data, for pre-training foundation models.
    long: >-
      Derives about 178 M high-$p_T$ jets from CMS 2016 open data and
      pre-trains the OmniJet-α foundation model on them. Pre-training on
      collision data improves the generation of the simulated top and QCD jets
      of JetClass despite the domain shift.
  Govorkova:2021hqu:
    inspire: 1876598
    category: dataset
    tags: [anomaly detection, real-time inference]
    short: A simulated trigger-level event stream for unsupervised new-physics detection at 40 MHz.
    long: >-
      Emulates the data stream of a real-time event-selection system,
      pre-filtered by requiring an electron or muon, so that new selection
      strategies and their sensitivity to new phenomena can be developed under
      trigger constraints.
  Elitez:2025aqs:
    inspire: 3093591
    category: dataset
    tags: [reconstruction]
    short: ColliderML, one million fully simulated HL-LHC events in the OpenDataDetector, for detector-level machine learning.
    long: >-
      Experiment-agnostic collisions at 14 TeV with a mean pile-up of 200,
      across ten Standard Model and beyond-Standard-Model processes plus
      single-particle samples, fully simulated, digitised and reconstructed,
      and published on Hugging Face.
  Adams:2020vlj:
    inspire: 1799200
    category: dataset
    tags: [reconstruction, neutrino physics]
    short: PILArNet, open 2D and 3D simulated data for liquid-argon time projection chambers.
    long: >-
      Described by its authors as the first open 2D and 3D dataset for
      liquid-argon time projection chambers, with 300,000 samples in three
      volume sizes for key reconstruction tasks.

  # ---- Challenges and comparisons ---------------------------------------------
  Kasieczka:2019dbj:
    inspire: 1722059
    category: challenge
    tags: [jet tagging]
    short: Machine-learning top taggers compared on a common Delphes dataset.
    long: >-
      Compares a wide range of top taggers that use low-level inputs, from
      calorimeter images to lists of particles, on the Top Tagging Reference
      Dataset. The architectures differ widely, their performance much less.
  ATLAS:2024rua:
    inspire: 2811690
    category: challenge
    tags: [jet tagging]
    short: Performance and systematic uncertainties of machine-learning top taggers in full ATLAS simulation.
    long: >-
      Evaluates several machine-learning top taggers on simulated 13 TeV ATLAS
      events and estimates their systematic uncertainties with an approximate
      procedure. The dataset, with its systematic variations, is public.
  Kasieczka:2021xcg:
    inspire: 1842125
    category: challenge
    tags: [anomaly detection]
    short: The LHC Olympics 2020, a community challenge for anomaly detection, with its datasets and results.
    long: >-
      Participants developed methods on an R&D dataset and applied them to
      black boxes holding an unknown anomaly, or none. The paper reviews the
      unsupervised, weakly supervised and semi-supervised methods submitted and
      their results.
  Aarrestad:2021oeb:
    inspire: 1866115
    category: challenge
    tags: [anomaly detection]
    short: The Dark Machines challenge, a billion-event benchmark for unsupervised new-physics searches.
    long: >-
      Proposes anomaly scores to define model-independent signal regions,
      releases more than a billion simulated 13 TeV events equivalent to
      10 fb⁻¹, and compares anomaly-detection and density-estimation algorithms
      in realistic analysis settings.
  Krause:2024avx:
    inspire: 2843542
    category: challenge
    tags: [fast simulation, generative models]
    short: The Fast Calorimeter Simulation Challenge 2022, 31 generative models compared on four shower datasets.
    long: >-
      Compares variational autoencoders, GANs, normalizing flows, diffusion and
      flow-matching models on showers from a few hundred to tens of thousands
      of voxels, by shower quality, generation time and model size. Quality is
      measured with histograms, KPD and FPD scores, classifier AUCs and a
      multiclass classifier.
  Benato:2024lnj:
    inspire: 2837322
    category: challenge
    tags: [inference]
    venue: Advances in Neural Information Processing Systems 38 (2025)
    short: The FAIR Universe HiggsML Uncertainty challenge, confidence intervals from imperfect simulators.
    long: >-
      Participants reported confidence intervals for a parameter of interest of
      the Higgs boson while accounting for systematic uncertainties, on a
      tabular dataset of 280 million simulated collisions with 28 features.
  AdamBourdarios:2015hml:
    category: challenge
    tags: [event classification]
    title: The Higgs boson machine learning challenge
    authors:
      - Adam-Bourdarios, Claire
      - Cowan, Glen
      - Germain, Cécile
      - Guyon, Isabelle
      - Kégl, Balázs
      - Rousseau, David
    year: 2015
    venue: Proc. NIPS 2014 Workshop on High-energy Physics and Machine Learning, PMLR 42 (2015) 19
    url: https://proceedings.mlr.press/v42/cowa14.html
    short: The 2014 HiggsML Kaggle challenge on selecting H → ττ events in ATLAS simulation.
    bibtex: |
      @inproceedings{AdamBourdarios:2015hml,
          author = "Adam-Bourdarios, Claire and Cowan, Glen and Germain, C{\'e}cile and Guyon, Isabelle and K{\'e}gl, Bal{\'a}zs and Rousseau, David",
          title = "{The Higgs boson machine learning challenge}",
          booktitle = "{Proceedings of the NIPS 2014 Workshop on High-energy Physics and Machine Learning}",
          series = "Proceedings of Machine Learning Research",
          volume = "42",
          pages = "19--55",
          year = "2015",
          url = "https://proceedings.mlr.press/v42/cowa14.html"
      }
  Amrouche:2019wmx:
    inspire: 1729722
    category: challenge
    tags: [reconstruction]
    venue: The NeurIPS ’18 Competition, Springer (2020)
    short: The TrackML accuracy phase on Kaggle in 2018, track finding at HL-LHC pile-up.
    long: >-
      Participants connected about 100,000 points per event into some 10,000
      particle trajectories. The paper shows that the competition's single
      score selects the best algorithms from the point of view of the domain.
  Amrouche:2021nbs:
    inspire: 2632195
    category: challenge
    tags: [reconstruction]
    short: The TrackML throughput phase, which scored the speed of track finding together with its accuracy.
    long: >-
      Run on Codalab, where submitted software was executed in a controlled
      environment. The best three solutions combined good accuracy with an
      order of magnitude more speed than the state of the art when the
      challenge was designed.
  Eller:2023myr:
    inspire: 2683158
    category: challenge
    tags: [neutrino physics, reconstruction]
    venue: Proc. 38th International Cosmic Ray Conference (2023)
    short: Organisation and findings of the IceCube Kaggle competition on neutrino direction reconstruction.
    long: >-
      Participants predicted the direction of incoming neutrinos from simulated
      events; hundreds of teams competed from January to April 2023.
  Bukhari:2023ezc:
    inspire: 2713927
    category: challenge
    tags: [neutrino physics, reconstruction]
    short: The three winning solutions of the IceCube Kaggle competition.
    long: >-
      Describes the data handling, architecture and training of each and
      compares them on the Kaggle dataset. The best reaches an angular
      resolution better than 5° for cascades above 10 TeV and better than 0.5°
      for tracks, comparable to the state of the art.

  # ---- Methods ------------------------------------------------------------------
  Baldi:2014kfa:
    inspire: 1281836
    category: method
    tags: [event classification]
    short: Deep networks for signal–background classification, with the HIGGS and SUSY benchmarks.
    long: >-
      Shows on benchmark datasets that deep networks need no manually
      constructed input features and improve the classification metric over
      shallow methods.
  Baldi:2016fzo:
    inspire: 1418479
    category: method
    tags: [event classification]
    short: Parameterized neural networks, which take physics parameters such as a particle's mass as input.
    long: >-
      One network interpolates smoothly between parameter values and replaces
      a set of classifiers trained at individual values, with improved
      performance at intermediate values.
  deOliveira:2015xxd:
    inspire: 1405106
    category: method
    tags: [jet tagging]
    short: Deep networks on jet images to identify boosted W bosons.
    long: >-
      Treats the detector as a camera and jets as images, shows that deep
      networks on jet images outperform physically motivated features, and
      visualises what the networks learn.
  deOliveira:2017pjk:
    inspire: 1510258
    category: method
    tags: [generative models]
    short: The Location-Aware GAN, which generates jet images.
    long: >-
      Generated images span many orders of magnitude in pixel intensity and
      reproduce physical properties such as jet mass and n-subjettiness; the
      paper also discusses the limitations of the approach.
  Butter:2017cot:
    inspire: 1613515
    category: method
    tags: [jet tagging]
    short: A top tagger built on Lorentz vectors and the Minkowski metric.
    long: >-
      Uses calorimeter towers and tracking information, and outperforms
      QCD-inspired and image-based taggers for strongly boosted top quarks.
  Paganini:2017dwg:
    inspire: 1645424
    category: method
    tags: [fast simulation, generative models]
    short: CaloGAN, generative adversarial networks for showers in a multilayer electromagnetic calorimeter.
    long: >-
      Achieves speed-ups of 100 to 1000 over full simulation on CPU and up to
      about 10⁵ on GPU, and reproduces geometric shower-shape properties of
      photons, positrons and charged pions.
  Duarte:2018ite:
    inspire: 1668914
    category: method
    tags: [real-time inference, jet tagging]
    short: Neural-network inference in FPGAs for the trigger, with hls4ml.
    long: >-
      A case study of a jet-substructure classifier on FPGAs, whose trigger and
      data-acquisition applications need sub-microsecond latency, with a
      companion compiler that translates trained networks into firmware.
  Komiske:2018cqr:
    inspire: 1698236
    category: method
    tags: [jet tagging]
    short: Energy and Particle Flow Networks, permutation-invariant networks for jets built on Deep Sets.
    long: >-
      Energy Flow Networks are infrared and collinear safe by construction;
      Particle Flow Networks admit general energy dependence and particle
      information such as charge and flavour. The quark and gluon jets used in
      the paper are public.
  Moreno:2019bmu:
    inspire: 1749751
    category: method
    tags: [jet tagging]
    short: JEDI-net, jet identification with interaction networks over the jet's constituents.
    long: >-
      Needs no special handling of sparse inputs, no particle ordering and no
      assumption about the detector geometry, and reaches better results with
      fewer parameters.
  Moreno:2019neq:
    inspire: 1756269
    category: method
    tags: [jet tagging, open data]
    short: Interaction networks over tracks and secondary vertices to identify boosted H → bb̄ jets.
    long: >-
      Describes the jet as particle-to-particle and particle-to-vertex
      interactions. Trained on CMS simulation released on the CERN Open Data
      Portal, it improves markedly on the algorithms of its time.
  Andreassen:2019cjw:
    inspire: 1766424
    category: method
    tags: [unfolding]
    short: OmniFold, unbinned unfolding of all observables at once by iterative reweighting.
    long: >-
      Uses classifiers to reweight a simulated dataset iteratively, so that
      every observable is unfolded without binning, including those not yet
      defined at the time of the analysis. Illustrated on jet substructure.
  Shlomi:2020ufi:
    inspire: 1810547
    category: method
    tags: [reconstruction, jet tagging]
    short: A set-to-graph network that finds secondary vertices inside jets.
    long: >-
      Decides for every pair of tracks in a jet whether they share a vertex,
      using all the jet's tracks. It outperforms traditional vertex finding and
      improves bottom-versus-charm flavour tagging.
  Pata:2021oez:
    inspire: 1842131
    category: method
    tags: [reconstruction]
    short: MLPF, end-to-end particle-flow reconstruction with graph neural networks.
    long: >-
      A scalable graph-network algorithm that reconstructs particles from
      tracks and calorimeter clusters, aimed at high pile-up and shown on a
      Delphes simulation with an average pile-up of 200.
  Kansal:2021cqp:
    inspire: 1869687
    category: method
    tags: [generative models]
    venue: Advances in Neural Information Processing Systems 34 (2021)
    short: The message-passing GAN for jets as particle clouds, released with the JetNet dataset.
    long: >-
      Finds existing point-cloud GANs inadequate for jets and evaluates
      generated jets with Wasserstein distances, a Fréchet ParticleNet
      distance, coverage and minimum matching distance.
  Qu:2022mxj:
    inspire: 2029602
    category: method
    tags: [jet tagging]
    venue: Proc. 39th International Conference on Machine Learning, PMLR 162 (2022) 18281
    short: The Particle Transformer and the JetClass dataset of 100 M jets in ten classes.
    long: >-
      The Particle Transformer adds pairwise particle interactions to the
      attention mechanism and surpasses a plain Transformer and ParticleNet;
      pre-trained models improve other tagging tasks after fine-tuning.
  Pata:2023rhh:
    inspire: 2697182
    category: method
    tags: [reconstruction]
    short: Scalable graph and transformer models for particle flow in full simulation of e⁺e⁻ collisions.
    long: >-
      Compares a graph neural network with a kernel-based transformer on tracks
      and calorimeter clusters. The best model improves the jet transverse
      momentum resolution by up to 50% over the rule-based algorithm.
  Li:2024htp:
    inspire: 2788738
    category: method
    tags: [jet tagging, foundation models]
    short: Sophon, a jet model pre-trained on the 188 classes of JetClass-II for resonance searches.
    long: >-
      Its outputs and learned features serve model-specific and model-agnostic
      searches for heavy resonances through transfer learning.
  Bhimji:2025isp:
    inspire: 3074318
    category: method
    tags: [foundation models, jet tagging]
    short: OmniLearned, a foundation model for jet physics trained on over 10⁹ jets.
    long: >-
      Upgrades the OmniLearn model's architecture and training, pools over a
      billion public jets for training, and provides documented software for
      all datasets and models.

  # ---- Jet-tagging architectures ------------------------------------------------
  Komiske:2016rsd:
    inspire: 1501944
    category: method
    tags: [jet tagging]
    short: Convolutional networks on multi-channel jet images for quark–gluon discrimination.
    long: >-
      Jet images get colour channels for charged and neutral transverse momentum
      and for charged-particle counts; the deep networks match or outperform
      traditional jet observables.
  Louppe:2017ipp:
    inspire: 1511884
    category: method
    tags: [jet tagging]
    short: Recursive neural networks that follow a jet's clustering history.
    long: >-
      Treats four-momenta as words and the sequential-recombination clustering
      tree as the parse of a sentence; the recursive networks are more accurate
      and data efficient than image-based ones.
  Qu:2019gqs:
    inspire: 1721352
    category: method
    tags: [jet tagging]
    short: ParticleNet, a dynamic graph convolutional network on jets as particle clouds.
    long: >-
      Represents a jet as an unordered set of its particles, which respects their
      permutation symmetry, and improves markedly on earlier methods on two
      tagging benchmarks.
  Mikuni:2020wpr:
    inspire: 1775788
    category: method
    tags: [jet tagging]
    short: ABCNet, a graph network with attention for point-cloud collider data.
    long: >-
      Applied to quark–gluon discrimination, a jet-level task, and to pile-up
      removal, which scores every particle.
  Mikuni:2021pou:
    inspire: 1845779
    category: method
    tags: [jet tagging]
    short: The point cloud transformer applied to the particles of collision events.
    long: >-
      Adapts a transformer for unordered point sets to jet tagging of highly
      boosted particles.
  Bogatskiy:2020tje:
    inspire: 1799848
    category: method
    tags: [jet tagging, equivariance]
    short: A neural network fully equivariant under the Lorentz group.
    long: >-
      Built on finite-dimensional representations of the Lorentz group with
      tensor-product nonlinearities, it gives simpler, more interpretable models
      with competitive top-tagging performance.
  Gong:2022lye:
    inspire: 2014148
    category: method
    tags: [jet tagging, equivariance]
    short: LorentzNet, a Lorentz-equivariant graph network with Minkowski dot-product attention.
    long: >-
      Keeps Lorentz symmetry without the costly high-order tensors of earlier
      equivariant models, and performs strongly on two jet-tagging benchmarks.
  Bogatskiy:2022czk:
    inspire: 2174635
    category: method
    tags: [jet tagging, equivariance]
    short: PELICAN, a permutation-equivariant network on Lorentz-invariant inputs.
    long: >-
      Outperforms earlier top taggers with much lower model complexity; a
      Lorentz-covariant variant regresses four-momenta.
  Bogatskiy:2023nnw:
    inspire: 2683691
    category: method
    tags: [jet tagging, equivariance]
    short: A detailed study of PELICAN for tagging and reconstructing boosted top quarks.
    long: >-
      Examines the complexity, interpretability and performance of the
      architecture for classification and four-momentum regression.
  Spinner:2024hjm:
    inspire: 2789600
    category: method
    tags: [jet tagging, equivariance, generative models]
    venue: Advances in Neural Information Processing Systems (NeurIPS 2024)
    short: L-GATr, a Lorentz-equivariant transformer over the geometric algebra of spacetime.
    long: >-
      Shown on regression and classification, and used to build what the authors
      describe as the first Lorentz-equivariant generative model, a continuous
      normalizing flow.

  # ---- Anomaly detection --------------------------------------------------------
  Metodiev:2017vrx:
    inspire: 1615464
    category: method
    tags: [anomaly detection]
    short: Classification without labels (CWoLa), training on mixed samples with different signal fractions.
    long: >-
      Needs neither event labels nor class proportions; the optimal classifier
      between the mixtures is the optimal fully supervised classifier.
  Collins:2018epr:
    inspire: 1672143
    category: method
    tags: [anomaly detection]
    short: CWoLa hunting, a weakly supervised bump hunt for signals localised in one feature.
    long: >-
      Classifiers trained between a signal region and its sidebands use other,
      uncorrelated features to enhance an unknown signal; shown on a dijet
      resonance search.
  Collins:2019jip:
    inspire: 1718003
    category: method
    tags: [anomaly detection]
    short: The CWoLa-hunting extension of the bump hunt, in full detail.
    long: >-
      Uses the invariant mass to build a signal-rich and a signal-poor sample and
      trains classifiers on features uncorrelated with it.
  Heimel:2018mkt:
    inspire: 1691810
    category: method
    tags: [anomaly detection]
    short: Autoencoders trained on QCD jets to find anomalous jet substructure.
    long: >-
      Works on images or four-vectors, and an adversary de-correlates the jet
      mass so that backgrounds and systematics stay controllable.
  Farina:2018fyg:
    inspire: 1691732
    category: method
    tags: [anomaly detection]
    short: Deep autoencoders whose reconstruction error flags anomalous jets.
    long: >-
      Trained on background, or on data with a small signal admixture, they
      enhance top and RPV gluino jets over QCD jets.
  Nachman:2020lpy:
    inspire: 1775739
    category: method
    tags: [anomaly detection]
    short: ANODE, anomaly detection with neural density estimates in the signal region and sidebands.
    long: >-
      Interpolates the sideband density into the signal region to form a
      likelihood ratio of data to background, which also estimates the
      background directly.
  Andreassen:2020nkr:
    inspire: 1775741
    category: method
    tags: [anomaly detection]
    short: SALAD, simulation reweighted to sideband data as the background model of a resonant search.
    long: >-
      Learns a parametrised reweighting of simulation to data in the sidebands
      and interpolates it into the signal region.
  Amram:2020ykb:
    inspire: 1782967
    category: method
    tags: [anomaly detection]
    short: Tag N' Train, classifiers trained on unlabelled data with two sub-objects.
    long: >-
      A weak classifier on one object tags signal-rich and background-rich
      samples, on which a stronger classifier for the other object is trained.
  Hallin:2021wme:
    inspire: 1915354
    category: method
    tags: [anomaly detection]
    short: CATHODE, a classifier between data and background events sampled from a sideband density estimator.
    long: >-
      A conditional density estimator trained outside the signal region is
      interpolated into it and sampled, approaching the optimal anomaly
      detector.
  Raine:2022hht:
    inspire: 2054235
    category: method
    tags: [anomaly detection]
    short: CURTAINs, invertible networks that map sideband data into the signal region as a background template.
    long: >-
      The transformation is conditioned on the resonant observable; the template
      is used for anomaly detection in a sliding-window bump hunt.
  Golling:2022nkl:
    inspire: 2617394
    category: method
    tags: [anomaly detection]
    short: FETA, a flow that maps background simulation to sideband data to build the background template.
    long: >-
      Conditioned on the resonant mass and trained with the signal region
      blinded, the flow is interpolated into it; shown on the LHC Olympics data.
  Finke:2023ltw:
    inspire: 2702512
    category: method
    tags: [anomaly detection]
    short: Boosted decision trees as the classifiers of weakly supervised anomaly detection.
    long: >-
      They outperform neural networks when there are many noisy input features,
      and train and evaluate much faster.
  ATLAS:2020iwa:
    inspire: 1794466
    category: application
    tags: [anomaly detection]
    short: A dijet resonance search in ATLAS data with classifiers trained by weak supervision.
    long: >-
      Searches for A → BC with large-radius jets B and C on 139 fb⁻¹ of 13 TeV
      data, using the two jet masses as features and no signal simulation to
      develop the selection.
  Belis:2023mqs:
    inspire: 2740326
    category: review
    tags: [anomaly detection]
    short: A review of machine-learning anomaly detection in particle physics.
    long: >-
      Covers detector monitoring and searches for unexpected events, their
      challenges and the successful applications.

  # ---- Simulation-based inference ---------------------------------------------
  Cranmer:2015bka:
    inspire: 1377273
    category: method
    tags: [inference]
    short: CARL, likelihood ratios approximated by calibrated discriminative classifiers.
    long: >-
      Classifiers trained on simulated samples approximate the likelihood ratio
      when the simulator cannot evaluate the likelihood.
  Brehmer:2018kdj:
    inspire: 1670936
    category: method
    tags: [inference]
    short: Likelihood-ratio estimators trained with extra information from the simulator, for effective field theories.
    long: >-
      They scale to many observables and parameters without approximating the
      shower or detector, and give stronger bounds on dimension-six operators.
  Brehmer:2018eca:
    inspire: 1670939
    category: method
    tags: [inference]
    short: A guide to, and comparison of, machine-learning inference techniques for collider parameters.
    long: >-
      Compares estimators on weak-boson-fusion Higgs production; the best are
      trained with extra information about the score from the simulator.
  Brehmer:2018hga:
    inspire: 1675782
    category: method
    tags: [inference]
    short: Mining gold, latent information from simulators as extra training targets for neural surrogates.
    long: >-
      New loss functions use this augmented data to improve the sample
      efficiency of density and ratio estimators.
  Brehmer:2019xox:
    inspire: 1746275
    category: software
    tags: [inference]
    short: MadMiner, a Python package for machine-learning-based inference with MadGraph, Pythia and Delphes.
    long: >-
      Streamlines matrix-element-augmented inference on high-dimensional event
      data, from generation to trained estimators.
  DeCastro:2018psv:
    inspire: 1677673
    category: method
    tags: [inference]
    short: INFERNO, summary statistics trained to minimise the uncertainty on the parameters of interest.
    long: >-
      Optimises non-linear summaries with an inference-aware loss that accounts
      for nuisance parameters.
  Ghosh:2021roe:
    inspire: 1864133
    category: method
    tags: [inference]
    short: Classifiers aware of systematic uncertainties and their nuisance parameters.
    long: >-
      Contrary to building analyses insensitive to uncertainties, this
      dependence can enhance the sensitivity to the parameters of interest.
  Hermans:2019ioj:
    inspire: 1725106
    category: method
    tags: [inference]
    venue: Proc. 37th International Conference on Machine Learning (2020)
    short: Amortised estimators of the likelihood-to-evidence ratio, used inside MCMC.
    long: >-
      One trained ratio estimator gives the likelihood ratios between states of
      a Markov chain, so the posterior can be sampled without the likelihood.
  Papamakarios:2016ctj:
    inspire: 2778549
    category: method
    tags: [inference]
    venue: Advances in Neural Information Processing Systems 29 (2016)
    short: Posterior estimation by Bayesian conditional density estimation, without an ε tolerance.
    long: >-
      Replaces the ε-ball of approximate Bayesian computation by a neural
      conditional density estimate of the posterior.
  Papamakarios:2018zoy:
    inspire: 2821953
    category: method
    tags: [inference]
    venue: Proc. 22nd International Conference on Artificial Intelligence and Statistics (2019)
    short: Sequential neural likelihood, an autoregressive flow trained to model the likelihood.
    long: >-
      Sequential rounds of simulation focus on the region of high posterior
      density and cut the simulation cost by orders of magnitude.
  ATLAS:2025clx:
    inspire: 2854620
    category: method
    tags: [inference]
    short: A neural simulation-based inference framework for full-scale ATLAS analyses.
    long: >-
      Neural networks estimate per-event density ratios, and the framework
      incorporates many systematic uncertainties without binning the data.
  ATLAS:2024jry:
    inspire: 2854934
    category: application
    tags: [inference]
    short: Off-shell Higgs production in H* → ZZ → 4ℓ measured with neural simulation-based inference.
    long: >-
      Builds per-event likelihood ratios with neural networks on 140 fb⁻¹ of
      13 TeV data, superseding the earlier result in this channel.
  Cranmer:2019eaq:
    inspire: 1763198
    category: review
    tags: [inference]
    short: A review of simulation-based inference across the sciences.
    long: >-
      Reviews the field and the developments that give it momentum.
  Brehmer:2020cvb:
    inspire: 1822448
    category: review
    tags: [inference]
    venue: Artificial Intelligence for Particle Physics, World Scientific (to appear)
    short: A review of simulation-based inference methods for particle physics.
    long: >-
      Explains why the likelihood of high-dimensional LHC data is intractable
      and reviews methods that combine machine learning with information from
      the simulator.
  Papamakarios:2019fms:
    inspire: 2727228
    category: review
    tags: [inference, generative models]
    short: A review of normalizing flows for probabilistic modelling and inference.
    long: >-
      Treats the principles of flow design, expressive power and computational
      trade-offs.

  # ---- Foundation models --------------------------------------------------------
  Dillon:2021gag:
    inspire: 1903053
    category: method
    tags: [foundation models, jet tagging]
    short: JetCLR, self-supervised contrastive learning of jet representations.
    long: >-
      A permutation-invariant transformer encoder learns representations of top
      and QCD jets, compared with other representations by linear classifier
      tests.
  Harris:2024sra:
    inspire: 2767709
    category: method
    tags: [foundation models]
    short: RS3L, contrastive pre-training with augmentations made by resimulating parts of an event.
    long: >-
      Rerunning the simulation downstream of an intervention gives several
      realisations of one event as positive pairs.
  Zhao:2024kry:
    inspire: 2819136
    category: method
    tags: [foundation models, jet tagging]
    venue: ACAT 2024 proceedings
    short: Contrastive pre-training on large unlabelled jet samples, then fine-tuning for classification.
    long: >-
      Learns representations with augmentations on jets and fine-tunes them with
      small labelled samples.
  Golling:2024abg:
    inspire: 2750977
    category: method
    tags: [foundation models]
    short: Masked particle modelling, self-supervised pre-training on sets by predicting masked particles.
    long: >-
      Masked particles are predicted as tokens of a pre-trained vector-quantised
      autoencoder, and the representations transfer to downstream tasks.
  Leigh:2024ked:
    inspire: 2830443
    category: method
    tags: [foundation models]
    short: Masked particle modelling without tokenisation, with conditional generative decoders.
    long: >-
      Improves the implementation and the decoder, and reconstructs the masked
      particles with conditional generative models instead of discrete tokens.
  Birk:2024knn:
    inspire: 2767165
    category: method
    tags: [foundation models, generative models, jet tagging]
    short: OmniJet-α, a transformer pre-trained to generate tokenised jets and fine-tuned for tagging.
    long: >-
      Introduces evaluation methods for tokenising physics data and shows
      transfer from unsupervised jet generation to jet tagging; described by its
      authors as the first cross-task foundation model for particle physics.
  Mikuni:2024qsr:
    inspire: 2780716
    category: method
    tags: [foundation models, jet tagging]
    short: OmniLearn, a jet foundation model applied to reconstruction, unfolding and anomaly detection.
    long: >-
      A Point-Edge Transformer with classification and generation heads,
      pre-trained on JetClass, saves computing in reconstruction, enables
      uncertainty quantification for high-dimensional measurements and searches
      with low-level inputs.
  Vigl:2024lat:
    inspire: 2751010
    category: method
    tags: [foundation models, jet tagging]
    short: A pre-trained jet network fine-tuned within a downstream analysis.
    long: >-
      Shows gains in performance and data efficiency in a search for heavy
      resonances decaying via di-Higgs to four b-jets.
  Park:2025ebs:
    inspire: 2962442
    category: method
    tags: [foundation models, reconstruction]
    short: FM4NPP, a scaling foundation model for detector data in nuclear and particle physics.
    long: >-
      Introduces a dataset of over 11 million collision events with downstream
      tasks, and a self-supervised method for sparse detector data with neural
      scaling behaviour.
  Hallin:2025ywf:
    inspire: 2973870
    category: review
    tags: [foundation models]
    short: A review of foundation models in high-energy physics.
    long: >-
      Summarises and discusses the published work on pre-trained models for
      particle physics.

  # ---- Software -----------------------------------------------------------------
  Kansal:2023iqy:
    inspire: 2719606
    category: software
    tags: [generative models]
    short: The jetnet Python package, with loaders for jet datasets and evaluation metrics.
    long: >-
      Built on PyTorch, it provides standard interfaces to several
      heterogeneous datasets, evaluation metrics, loss functions and
      utilities.

