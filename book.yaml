title: Scientific Papers Guidebook
subtitle: The papers behind the datasets, methods and tools of machine learning in science
kicker: Reference literature
author: Alkaid Cheng
url: https://alkaidcheng.github.io/papers_guidebook/
repo: https://github.com/AlkaidCheng/papers_guidebook
repo_host: GitHub
# A page's edit link is this prefix followed by its path under book/.
edit_url: https://github.com/AlkaidCheng/papers_guidebook/blob/main/book/
not_found_page: true
sitemap: true
# Readers look entries up instead of reading in order, so pages carry no numbers.
layout: reference

# Parts are fields; their pages are topics. Each part directory needs an
# index.md. datasets.md and papers.md are written by scripts/catalogue.py from
# catalogue/*.yaml; edit those files, not the pages.
parts:
  - dir: ml-hep
    title: Machine Learning for Particle Physics
    chapters:
      - datasets.md
      - jet-tagging.md
      - anomaly-detection.md
      - simulation-based-inference.md
      - generative-models.md
      - foundation-models.md
      - papers.md
